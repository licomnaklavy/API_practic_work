<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Тест API</title>
</head>
<body>
    <h1>Тест API</h1>
    
    <button onclick="switchTab('items')">Items</button>
    <button onclick="switchTab('mobs')">Mobs</button>
    <button onclick="switchTab('blocks')">Blocks</button>
    
    <div id="content"></div>

    <script>
        const API = '/api';
        let currentTab = 'items';

        function switchTab(tab) {
            currentTab = tab;
            load(tab);
        }

        async function load(entity) {
            const res = await fetch(`${API}/${entity}`);
            const data = await res.json();
            const container = document.getElementById('content');
            
            if (!data || data.length === 0) {
                container.innerHTML = '<p>Нет данных</p>';
                return;
            }

            let html = `<h2>${entity}</h2><button onclick="showAdd('${entity}')">+ Добавить</button>`;
            
            data.forEach(item => {
                html += `<div style="border:1px solid #ccc; margin:5px 0; padding:10px;">`;
                html += `<strong>${item.name || 'Без названия'}</strong><br>`;
                
                for (const [key, value] of Object.entries(item)) {
                    if (key !== '_id' && key !== 'name') {
                        html += `${key}: ${Array.isArray(value) ? value.join(', ') : value}<br>`;
                    }
                }
                
                html += `<button onclick="editItem('${entity}','${item._id}')">✏️</button>`;
                html += `<button onclick="deleteItem('${entity}','${item._id}')">🗑️</button>`;
                html += `</div>`;
            });
            
            container.innerHTML = html;
        }

        function showAdd(entity) {
            const name = prompt('Название:');
            if (!name) return;
            
            fetch(`${API}/${entity}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            }).then(() => load(entity));
        }

        async function editItem(entity, id) {
            const res = await fetch(`${API}/${entity}/${id}`);
            const item = await res.json();
            
            const newName = prompt('Новое название:', item.name);
            if (!newName) return;
            
            item.name = newName;
            
            fetch(`${API}/${entity}/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(item)
            }).then(() => load(entity));
        }

        function deleteItem(entity, id) {
            if (!confirm('Удалить?')) return;
            fetch(`${API}/${entity}/${id}`, { method: 'DELETE' })
                .then(() => load(entity));
        }

        load('items');
    </script>
</body>
</html>
